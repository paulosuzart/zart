[package]
name = "zart-examples"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "example-brewery-finder"
path = "brewery-finder/src/main.rs"

[[bin]]
name = "example-approval-workflow"
path = "approval-workflow/src/main.rs"

[[bin]]
name = "example-parallel-steps"
path = "parallel-steps/src/main.rs"

[[bin]]
name = "example-autoagents-agent"
path = "autoagents-agent/src/main.rs"

[[bin]]
name = "example-retry-simulation"
path = "retry-simulation/src/main.rs"

[[bin]]
name = "example-durable-loops"
path = "durable-loops/src/main.rs"

[[bin]]
name = "example-sleep"
path = "sleep/src/main.rs"

[[bin]]
name = "example-error-handling"
path = "error-handling/src/main.rs"

[[bin]]
name = "example-transactions"
path = "transactions/src/main.rs"

[[bin]]
name = "example-scheduler-only"
path = "scheduler-only/src/main.rs"

[[bin]]
name = "example-recurring-tasks"
path = "recurring-tasks/src/main.rs"

[[bin]]
name = "example-recurring-durable"
path = "recurring-durable/src/main.rs"

[dependencies]
zart = { path = "../crates/zart" }
zart-macros = { path = "../crates/zart-macros" }
zart-scheduler = { path = "../crates/zart-scheduler" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
reqwest = { version = "0.13", features = ["json", "query"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sqlx = { workspace = true }
autoagents = { version = "0.4.0", features = ["google", "openai", "anthropic"] }
thiserror = { workspace = true }
