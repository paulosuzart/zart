[workspace]

[package]
name = "zart-ts"
version = "0.3.0"
edition = "2024"
authors = ["Zart Contributors"]
license = "MIT"
repository = "https://github.com/paulosuzart/zart"

[lib]
name = "zart_ts"
crate-type = ["cdylib"]

[dependencies]
zart = { path = "../../crates/zart" }
zart-core = { path = "../../crates/zart-core" }
zart-scheduler = { path = "../../crates/zart-scheduler" }

napi = { version = "2", default-features = false, features = ["napi6", "async", "tokio_rt", "serde-json"] }
napi-derive = "2"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54", features = ["full"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "chrono", "json", "uuid", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
async-trait = "0.1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
