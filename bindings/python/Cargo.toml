[workspace]

[package]
name = "zart-py"
version = "0.3.0"
edition = "2024"
authors = ["Zart Contributors"]
license = "MIT"
repository = "https://github.com/paulosuzart/zart"

[lib]
name = "_zart"
crate-type = ["cdylib"]

[dependencies]
zart = { path = "../../crates/zart" }
zart-core = { path = "../../crates/zart-core" }
zart-scheduler = { path = "../../crates/zart-scheduler" }

pyo3 = { version = "0.30", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }
pythonize = "0.30"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54", features = ["full"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "chrono", "json", "uuid", "migrate"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
