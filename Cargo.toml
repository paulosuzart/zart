[workspace]
members = [
    "crates/zart-scheduler",
    "crates/zart",
    "crates/zart-cli",
    "crates/zart-api",
    "crates/zart-macros",
    "examples",
    "examples/admin-demo",
    "examples/cli-demo",
    "examples/ui-demo", "crates/zart-core",
]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2024"
authors = ["Zart Contributors"]
license = "MIT"
repository = "https://github.com/paulosuzart/zart"

[workspace.dependencies]
# Internal crates
zart-core = { path = "crates/zart-core", version = "0.2.1" }
zart-scheduler = { path = "crates/zart-scheduler", version = "0.2.1" }
zart = { path = "crates/zart", version = "0.2.1" }
zart-macros = { path = "crates/zart-macros", version = "0.2.1" }

# Async runtime
tokio = { version = "1.54.1", features = ["full"] }
async-trait = "0.1.92"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# Error handling
thiserror = "2"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.14"

# Graceful shutdown
tokio-util = { version = "0.7", features = ["rt"] }

# IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Cron
cron = "0.17"

# Glob matching
globset = "0.4.21"

# HTTP
axum = { version = "0.8", features = ["json"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "chrono", "json", "uuid", "migrate"] }

# Proc-macro utilities (only used by zart-macros, kept here for consistency)
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }

# Testing
tokio-test = "0.4"
